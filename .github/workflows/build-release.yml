# =============================================================================
# build-release.yml
# Triggered on every push (merge) to `main`. Produces a "Beta" pre-release on
# GitHub using the shared build pipeline defined in _build.yml.
#
# Asset filenames for the beta flow intentionally omit the version (e.g.
# `SpaceWarrior.love`) to preserve the existing download URL shape used by
# external testers. Versioned releases are handled by release.yml.
# =============================================================================

name: Build and Release (Beta)

on:
  push:
    branches:
      - main

env:
  LOVE_VERSION: "11.5"
  GAME_NAME: "SpaceWarrior"

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      game_version: beta-${{ github.run_number }}
      asset_infix: ""

  release:
    name: "Publish Beta Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download love-package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: love-package
          path: dist/

      - name: Download platform-builds artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-builds
          path: dist/

      - name: Create Beta Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: "beta-${{ github.run_number }}"
          name: "Beta Build #${{ github.run_number }}"
          prerelease: true
          body: |
            **Automated Beta Build** — from commit `${{ github.sha }}`

            > ⚠️ This is a pre-release build for testing purposes only.

            ## Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `SpaceWarrior-windows-x64.zip` | Extract and run `SpaceWarrior.exe` |
            | 🍎 macOS   | `SpaceWarrior-macos.zip`       | Extract and open `SpaceWarrior.app` |
            | 🐧 Linux   | `SpaceWarrior-linux-x86_64.AppImage` | `chmod +x` then run |
            | 🎮 LÖVE    | `SpaceWarrior.love`            | Requires [LÖVE ${{ env.LOVE_VERSION }}](https://love2d.org) |
          files: |
            dist/SpaceWarrior.love
            dist/SpaceWarrior-windows-x64.zip
            dist/SpaceWarrior-macos.zip
            dist/SpaceWarrior-linux-x86_64.AppImage
